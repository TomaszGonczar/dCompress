name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  privacy:
    # Publication gate. It runs on one runner because it reads text and git objects, not the
    # platform, and it installs nothing: the scanner is dependency-free so a leak blocks the merge
    # even when the dependency job is broken.
    name: Privacy scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # History mode reads the commits this change adds; a shallow clone has none of them.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Scan the working tree
        run: node scripts/privacy-scan.mjs --json
      - name: Scan the history this change adds
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          # A pull request is scanned from its base commit; a push from the commit it replaced. A
          # first push has no usable parent, so the tip commit is scanned on its own.
          if [ -n "${PULL_REQUEST_BASE}" ]; then
            range="${PULL_REQUEST_BASE}..HEAD"
          elif [ -n "${PUSH_BEFORE}" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..HEAD"
          else
            range="HEAD^..HEAD"
          fi
          echo "privacy scan range: ${range}"
          node scripts/privacy-scan.mjs --history "${range}" --json

  clean-clone:
    # Publication gate: proves the README's "Try it in 60 seconds" claim from a stranger's
    # position rather than from a developer checkout that already has node_modules and dist.
    # The gate script has no dependency of its own — it clones this checkout locally, then
    # installs and builds only inside that temporary clone — so this job needs nothing installed
    # beyond Node and git, both already on the runner image.
    name: Clean-clone reproduction
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Run the clean-clone reproduction gate
        run: node scripts/clean-clone-check.mjs --json
